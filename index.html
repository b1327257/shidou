  <title>index</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e40af;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --music-acc: #0284c7;
      --music-bg: #f0f9ff;
      --music-border: #bae6fd;
      --art-acc: #d97706;
      --art-bg: #fffbeb;
      --art-border: #fde68a;
      --success: #059669;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --blank-hidden-bg: #1e293b;
      --blank-hidden-text: transparent;
      --blank-open-bg: #fef3c7;
      --blank-open-text: #b45309;
      --blank-open-border: #f59e0b;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding-bottom: 64px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      max-width: 1080px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: var(--primary);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #ffffff;
      flex: none;
      box-shadow: 0 2px 4px rgba(29, 78, 216, 0.2);
    }

    .brand-icon svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .brand-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }

    .progress-pill {
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .subject-bar {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 16px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .subject-bar::-webkit-scrollbar {
      display: none;
    }

    .subj-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .subj-tab:hover {
      background: #f8fafc;
      color: var(--text);
    }

    .subj-tab.active-music {
      background: var(--music-acc);
      color: #ffffff;
      border-color: var(--music-acc);
    }

    .subj-tab.active-art {
      background: var(--art-acc);
      color: #ffffff;
      border-color: var(--art-acc);
    }

    .subj-tab.active-overview {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .subj-slot-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 11px;
      border-radius: 8px;
      border: 1px dashed #cbd5e1;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 600;
      white-space: nowrap;
      background: #f8fafc;
    }

    .main-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 16px 32px;
    }

    .mode-toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mode-btn {
      padding: 7px 13px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: #f1f5f9;
      color: var(--text-sub);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: var(--text);
      color: #ffffff;
    }

    .bulk-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      padding: 6px 11px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    .ctrl-btn.active-filter {
      background: #eff6ff;
      color: var(--primary);
      border-color: var(--primary-border);
    }

    .step-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .step-nav::-webkit-scrollbar {
      display: none;
    }

    .step-pill {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.79rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .step-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .step-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .step-header {
      padding: 14px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .step-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .step-badge {
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #ffffff;
      background: var(--primary);
      flex: none;
    }

    .step-badge.music { background: var(--music-acc); }
    .step-badge.art { background: var(--art-acc); }

    .step-heading {
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
      color: var(--text);
    }

    .step-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .study-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: #ffffff;
      transition: border-color 0.15s ease;
    }

    .study-card.mastered {
      border-color: var(--success-border);
      background: #fafffd;
    }

    .card-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .source-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      background: #e2e8f0;
      color: #334155;
    }

    .source-tag.honsoku {
      background: #dbeafe;
      color: #1e40af;
    }

    .source-tag.kaisetsu {
      background: #f3e8ff;
      color: #6b21a8;
    }

    .exam-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .card-title {
      font-size: 0.93rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .master-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .master-btn.is-mastered {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    .clause-box {
      font-size: 0.92rem;
      line-height: 1.85;
      color: var(--text);
      background: #f8fafc;
      border-left: 3px solid var(--primary);
      padding: 10px 13px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 8px;
    }

    .clause-box.music-border { border-left-color: var(--music-acc); }
    .clause-box.art-border { border-left-color: var(--art-acc); }

    .clause-box p {
      margin: 0 0 8px 0;
    }
    .clause-box p:last-child {
      margin-bottom: 0;
    }

    .point-note {
      font-size: 0.82rem;
      color: var(--text-sub);
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 8px;
      line-height: 1.6;
    }

    .point-note strong {
      color: #92400e;
    }

    .blank-chip {
      display: inline-block;
      min-width: 3.2em;
      padding: 1px 8px;

      user-select: none;

      vertical-align: baseline;
      text-align: center;
    }

    .blank-chip.is-hidden {

      color: var(--blank-hidden-text);
      border: 1px solid var(--blank-hidden-bg);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);

      content: "•••";
      color: #94a3b8;
      font-size: 0.75em;
      letter-spacing: 1px;
    }

    .blank-chip.is-hidden span {
      display: none;
    }

    .blank-chip.is-open {
      background: var(--blank-open-bg);
      color: var(--blank-open-text);
      border: 1px solid var(--blank-open-border);
    }

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
      font-size: 0.86rem;
    }

      border: 1px solid var(--border);
      padding: 10px 12px;
      vertical-align: top;
      text-align: left;
      line-height: 1.7;
    }

      font-weight: 700;
      color: var(--text);
    }

      font-weight: 700;
      width: 140px;
      color: var(--text-sub);
    }

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);

      align-items: center;

      margin-bottom: 14px;
      padding-bottom: 12px;

      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.75;
      margin-bottom: 14px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid var(--border);

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .quiz-opt-btn {
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.55;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .quiz-opt-btn:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .quiz-opt-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: #065f46;
    }

    .quiz-opt-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: #991b1b;
    }

    .quiz-feedback {
      padding: 13px 15px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      font-size: 0.86rem;
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .subj-summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .subj-summary-card.future-slot {
      background: #f8fafc;
      border-style: dashed;
      opacity: 0.85;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      place-items: center;
      z-index: 100;
      padding: 16px;

    .modal-panel {
      background: #ffffff;

      max-width: 460px;

const DB_NAME = "ElemCertSystematicStudyDB";
const DB_VERSION = 1;
const FALLBACK_KEY = "elem_cert_study_state_v1";

const appState = {
  activeSubject: "music",
  activeMode: "steps",
  activeStepId: "all",
  showOnlyUnmastered: false,
  quizFilter: "all",
  quizIndex: 0,
  quizAnswered: false,
  quizSelectedOpt: null,
  blanks: {},
  mastery: {},
  quizStats: {}
};

let dbInstance = null;

function openStudyDB() {
  return new Promise((resolve) => {
    if (!window.indexedDB) {
      resolve(null);
      return;
    }
    try {
      const req = window.indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("kv")) {
          db.createObjectStore("kv");
        }
      };
      req.onsuccess = (e) => {
        dbInstance = e.target.result;
        resolve(dbInstance);
      };
      req.onerror = () => resolve(null);
    } catch (err) {
      resolve(null);
    }
  });
}

function getPersistPayload() {
  return {
    activeSubject: appState.activeSubject,
    activeMode: appState.activeMode,
    activeStepId: appState.activeStepId,
    showOnlyUnmastered: appState.showOnlyUnmastered,
    quizFilter: appState.quizFilter,
    blanks: appState.blanks,
    mastery: appState.mastery,
    quizStats: appState.quizStats,
    savedAt: new Date().toISOString()
  };
}

async function saveStateToDB() {
  const payload = getPersistPayload();
  try {
    localStorage.setItem(FALLBACK_KEY, JSON.stringify(payload));
  } catch (e) {}

  if (!dbInstance) return;
  return new Promise((resolve) => {
    try {
      const tx = dbInstance.transaction("kv", "readwrite");
      tx.objectStore("kv").put(payload, "rootState");
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    } catch (e) {
      resolve(false);
    }
  });
}

async function loadStateFromDB() {
  let loaded = null;
  if (dbInstance) {
    loaded = await new Promise((resolve) => {
      try {
        const tx = dbInstance.transaction("kv", "readonly");
        const req = tx.objectStore("kv").get("rootState");
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      } catch (e) {
        resolve(null);
      }
    });
  }
  if (!loaded) {
    try {
      const raw = localStorage.getItem(FALLBACK_KEY);
      if (raw) loaded = JSON.parse(raw);
    } catch (e) {}
  }
  if (loaded && typeof loaded === "object") {
    if (loaded.activeSubject) appState.activeSubject = loaded.activeSubject;
    if (loaded.activeMode) appState.activeMode = loaded.activeMode;
    if (loaded.activeStepId) appState.activeStepId = loaded.activeStepId;
    if (typeof loaded.showOnlyUnmastered === "boolean") appState.showOnlyUnmastered = loaded.showOnlyUnmastered;
    if (loaded.quizFilter) appState.quizFilter = loaded.quizFilter;
    if (loaded.blanks && typeof loaded.blanks === "object") appState.blanks = loaded.blanks;
    if (loaded.mastery && typeof loaded.mastery === "object") appState.mastery = loaded.mastery;
    if (loaded.quizStats && typeof loaded.quizStats === "object") appState.quizStats = loaded.quizStats;
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderTextWithBlanks(rawText) {
  const escaped = escapeHtml(rawText).replace(/\n/g, "<br>");
  return escaped.replace(/\{\{([a-zA-Z0-9_]+)\|([^}]+)\}\}/g, (_, blankId, answerText) => {
    const isRevealed = Boolean(appState.blanks[blankId]);
    const stateClass = isRevealed ? "is-open" : "is-hidden";
    return `<button type="button" class="blank-chip ${stateClass}" data-blank-id="${blankId}" aria-pressed="${isRevealed}"><span>${answerText}</span></button>`;
  });
}

function extractBlankIdsFromText(rawText) {
  const ids = [];
  const re = /\{\{([a-zA-Z0-9_]+)\|([^}]+)\}\}/g;
  let m;
  while ((m = re.exec(rawText)) !== null) {
    ids.push(m[1]);
  }
  return ids;
}

function getAllBlankIdsForSubject(subjKey) {
  const subj = SUBJECT_DATA[subjKey];
  if (!subj) return [];
  const ids = [];
  subj.steps.forEach((st) => {
    st.items.forEach((it) => {
      it.clauses.forEach((c) => ids.push(...extractBlankIdsFromText(c)));
    });
  });
  subj.matrices.forEach((mat) => {
    mat.rows.forEach((r) => {
      r.forEach((cell) => ids.push(...extractBlankIdsFromText(cell)));
    });
  });
  return ids;
}

function getSubjectStats(subjKey) {
  const subj = SUBJECT_DATA[subjKey];
  let totalItems = 0;
  let masteredItems = 0;
  subj.steps.forEach((st) => {
    st.items.forEach((it) => {
      totalItems++;
      if (appState.mastery[it.id]) masteredItems++;
    });
  });
  const blankIds = getAllBlankIdsForSubject(subjKey);
  let openBlanks = 0;
  blankIds.forEach((id) => {
    if (appState.blanks[id]) openBlanks++;
  });
  return {
    totalItems,
    masteredItems,
    totalBlanks: blankIds.length,
    openBlanks
  };
}

function showToast(msg) {
  const el = document.getElementById("toastMsg");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => {
    el.classList.remove("show");
  }, 2000);
}

  } else if (appState.activeSubject === "art") {

  } else {

  const tabArt = document.getElementById("tabSubjArt");

  tabArt.className = "subj-tab" + (appState.activeSubject === "art" ? " active-art" : "");

function renderStepNav(subj) {
  const container = document.getElementById("stepNavContainer");
  if (appState.activeSubject === "overview" || appState.activeMode !== "steps") {
    container.innerHTML = "";
    return;
  }
  let html = `<button type="button" class="step-pill ${appState.activeStepId === "all" ? "active" : ""}" data-step-id="all">全STEP表示</button>`;
  subj.steps.forEach((st) => {
    const isAct = appState.activeStepId === st.stepId ? "active" : "";
    html += `<button type="button" class="step-pill ${isAct}" data-step-id="${st.stepId}">${st.stepNum}</button>`;
  });
  container.innerHTML = html;
}

function renderStepsView(subj) {
  let html = "";
  const stepsToRender = appState.activeStepId === "all"
    ? subj.steps
    : subj.steps.filter((s) => s.stepId === appState.activeStepId);

  stepsToRender.forEach((st) => {
    const items = appState.showOnlyUnmastered
      ? st.items.filter((it) => !appState.mastery[it.id])
      : st.items;

    if (items.length === 0) return;

    html += `
      <section class="step-section" data-step-section="${st.stepId}">
        <div class="step-header">
          <div class="step-title-group">
            <span class="step-badge ${subj.colorClass}">${st.stepNum}</span>
            <h2 class="step-heading">${escapeHtml(st.title)}</h2>
          </div>
          <div class="step-actions">
            <button type="button" class="ctrl-btn" data-step-bulk="hide" data-target-step="${st.stepId}">このSTEPを隠す</button>
            <button type="button" class="ctrl-btn" data-step-bulk="show" data-target-step="${st.stepId}">このSTEPを表示</button>
          </div>
        </div>
        <div class="step-body">
    `;

    items.forEach((it) => {
      const isMastered = Boolean(appState.mastery[it.id]);
      const srcClass = it.sourceType === "honsoku" ? "honsoku" : "kaisetsu";
      html += `
        <article class="study-card ${isMastered ? "mastered" : ""}" data-item-id="${it.id}">
          <div class="card-top">
            <div class="card-tags">
              <span class="source-tag ${srcClass}">${escapeHtml(it.sourceLabel)}</span>
              ${it.examBadge ? `<span class="exam-badge">${escapeHtml(it.examBadge)}</span>` : ""}
              <h3 class="card-title">${escapeHtml(it.title)}</h3>
            </div>
            <button type="button" class="master-btn ${isMastered ? "is-mastered" : ""}" data-toggle-master="${it.id}">
              <span>${isMastered ? "✓ 習得済み" : "習得チェック"}</span>
            </button>
          </div>
          <div class="clause-box ${subj.colorClass}-border">
            ${it.clauses.map((c) => `<p>${renderTextWithBlanks(c)}</p>`).join("")}
          </div>
          ${it.note ? `<div class="point-note">${it.note}</div>` : ""}
        </article>
      `;
    });

    html += `
        </div>
      </section>
    `;

    html = `<div class="step-section" style="padding:28px;text-align:center;color:var(--text-muted);font-weight:600;">すべての項目が「習得済み」になっています。「未習得のみ」フィルタを解除すると全項目を表示します。</div>`;
  }

}

function renderMatrixView(subj) {
  let html = "";
  subj.matrices.forEach((mat, idx) => {
    html += `
      <section class="matrix-card">
        <div class="step-header">
          <div class="step-title-group">
            <span class="step-badge ${subj.colorClass}">表 ${idx + 1}</span>
            <h2 class="step-heading">${escapeHtml(mat.title)}</h2>
          </div>
        </div>
        <div class="matrix-scroll">
          <table class="matrix-table">
            <thead>
              <tr>

function getFilteredQuizList() {
  let list = QUIZ_DATA;
  if (appState.activeSubject === "music" || appState.activeSubject === "art") {
    list = list.filter((q) => q.subject === appState.activeSubject);
  }
  if (appState.quizFilter === "unmastered") {
    list = list.filter((q) => {
      const st = appState.quizStats[q.id];
      return !st || !st.lastCorrect;
    });
  }
  return list;
}

function renderQuizView() {
  const list = getFilteredQuizList();
  if (list.length === 0) {
    return `
      <div class="quiz-container" style="text-align:center;padding:32px;">
        <p style="font-weight:700;margin:0 0 12px 0;">該当する未習得問題はありません（全問正解済み）</p>
        <button type="button" class="ctrl-btn" data-quiz-filter="all">全問題を表示する</button>
      </div>
    `;
  }
  if (appState.quizIndex >= list.length) {
    appState.quizIndex = 0;
  }
  const q = list[appState.quizIndex];
  const st = appState.quizStats[q.id] || { correct: 0, wrong: 0, lastCorrect: false };

  let optsHtml = "";
  q.options.forEach((optText, idx) => {
    let cls = "quiz-opt-btn";
    if (appState.quizAnswered) {
      if (idx === q.answer) cls += " correct";
      else if (idx === appState.quizSelectedOpt) cls += " wrong";
    }
    optsHtml += `
      <button type="button" class="${cls}" data-quiz-opt="${idx}" ${appState.quizAnswered ? "disabled" : ""}>
        ${escapeHtml(optText)}
      </button>
    `;
  });

  let feedbackHtml = "";
  if (appState.quizAnswered) {
    const isOk = appState.quizSelectedOpt === q.answer;
    feedbackHtml = `
      <div class="quiz-feedback">
        <div style="font-weight:800;margin-bottom:4px;color:${isOk ? "var(--success)" : "var(--danger)"};">
          ${isOk ? "⭕ 正解！" : "❌ 不正解"}
        </div>
        <div>${escapeHtml(q.explanation)}</div>
      </div>
    `;
  }

  return `
    <div class="quiz-container">
      <div class="quiz-header-bar">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span class="exam-badge">${escapeHtml(q.badge)}</span>
          <span style="font-size:0.84rem;font-weight:700;color:var(--text-sub);">問題 ${appState.quizIndex + 1} / ${list.length}</span>
          <span style="font-size:0.78rem;color:var(--text-muted);">（正解:${st.correct} / 誤答:${st.wrong}）</span>
        </div>
        <div style="display:flex;gap:6px;">
          <button type="button" class="ctrl-btn ${appState.quizFilter === "all" ? "active-filter" : ""}" data-quiz-filter="all">全問題</button>
          <button type="button" class="ctrl-btn ${appState.quizFilter === "unmastered" ? "active-filter" : ""}" data-quiz-filter="unmastered">未正解のみ</button>
        </div>
      </div>

      <div class="quiz-q-box">${escapeHtml(q.question).replace(/\n/g, "<br>")}</div>
      <div class="quiz-options">${optsHtml}</div>
      ${feedbackHtml}

      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <button type="button" class="ctrl-btn" id="btnPrevQuiz">← 前の問題</button>
        <button type="button" class="ctrl-btn" id="btnNextQuiz" style="background:var(--primary);color:#fff;border-color:var(--primary);">次の問題 →</button>
      </div>
    </div>
  `;
}

function renderApp() {
  updateHeaderAndTabs();
  const area = document.getElementById("appContentArea");
  if (appState.activeSubject === "overview") {
    area.innerHTML = renderOverviewDashboard();
    return;
  }

  const subj = SUBJECT_DATA[appState.activeSubject] || SUBJECT_DATA.music;
  renderStepNav(subj);

  if (appState.activeMode === "steps") {
    area.innerHTML = renderStepsView(subj);
  } else if (appState.activeMode === "matrix") {
    area.innerHTML = renderMatrixView(subj);
  } else {
    area.innerHTML = renderQuizView();
  }
}

function setupEventListeners() {
  document.querySelectorAll(".subj-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      const targetSubj = btn.getAttribute("data-subject");
      if (!targetSubj) return;
      appState.activeSubject = targetSubj;
      appState.activeStepId = "all";
      appState.quizIndex = 0;
      appState.quizAnswered = false;
      saveStateToDB();
      renderApp();
    });
  });

  document.querySelectorAll(".mode-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const mode = btn.getAttribute("data-mode");
      if (!mode) return;
      appState.activeMode = mode;
      appState.quizIndex = 0;
      appState.quizAnswered = false;
      saveStateToDB();
      renderApp();
    });
  });

  document.getElementById("btnHideAllVisible").addEventListener("click", () => {
    const chips = document.querySelectorAll("#appContentArea .blank-chip");
    chips.forEach((chip) => {
      const id = chip.getAttribute("data-blank-id");
      if (id) appState.blanks[id] = false;
    });
    saveStateToDB();
    renderApp();
    showToast("表示中の穴埋めをすべて隠しました（状態保存済）");
  });

  document.getElementById("btnShowAllVisible").addEventListener("click", () => {
    const chips = document.querySelectorAll("#appContentArea .blank-chip");
    chips.forEach((chip) => {
      const id = chip.getAttribute("data-blank-id");
      if (id) appState.blanks[id] = true;
    });
    saveStateToDB();
    renderApp();
    showToast("表示中の穴埋めをすべて表示しました（状態保存済）");
  });

  document.getElementById("btnToggleUnmastered").addEventListener("click", () => {
    appState.showOnlyUnmastered = !appState.showOnlyUnmastered;
    saveStateToDB();
    renderApp();
  });

  document.getElementById("stepNavContainer").addEventListener("click", (e) => {
    const pill = e.target.closest("[data-step-id]");
    if (!pill) return;
    appState.activeStepId = pill.getAttribute("data-step-id");
    saveStateToDB();
    renderApp();
  });

  document.getElementById("appContentArea").addEventListener("click", (e) => {
    const chip = e.target.closest(".blank-chip");
    if (chip) {
      const blankId = chip.getAttribute("data-blank-id");
      if (!blankId) return;
      const nextState = !Boolean(appState.blanks[blankId]);
      appState.blanks[blankId] = nextState;
      chip.classList.toggle("is-open", nextState);
      chip.classList.toggle("is-hidden", !nextState);
      chip.setAttribute("aria-pressed", String(nextState));
      saveStateToDB();
      return;
    }

    const stepBulk = e.target.closest("[data-step-bulk]");
    if (stepBulk) {
      const action = stepBulk.getAttribute("data-step-bulk");
      const stepId = stepBulk.getAttribute("data-target-step");
      const section = document.querySelector(`[data-step-section="${stepId}"]`);
      if (section) {
        const shouldReveal = action === "show";
        section.querySelectorAll(".blank-chip").forEach((c) => {
          const bid = c.getAttribute("data-blank-id");
          if (bid) appState.blanks[bid] = shouldReveal;
        });
        saveStateToDB();
        renderApp();
      }
      return;
    }

    const masterBtn = e.target.closest("[data-toggle-master]");
    if (masterBtn) {
      const itemId = masterBtn.getAttribute("data-toggle-master");
      if (!itemId) return;
      appState.mastery[itemId] = !Boolean(appState.mastery[itemId]);
      saveStateToDB();
      renderApp();
      return;
    }

    const jumpBtn = e.target.closest("[data-jump-subj]");
    if (jumpBtn) {
      appState.activeSubject = jumpBtn.getAttribute("data-jump-subj");
      appState.activeMode = jumpBtn.getAttribute("data-jump-mode") || "steps";
      appState.activeStepId = "all";
      saveStateToDB();
      renderApp();
      return;
    }

    const quizOpt = e.target.closest("[data-quiz-opt]");
    if (quizOpt && !appState.quizAnswered) {
      const idx = parseInt(quizOpt.getAttribute("data-quiz-opt"), 10);
      const list = getFilteredQuizList();
      const q = list[appState.quizIndex];
      if (!q) return;
      appState.quizAnswered = true;
      appState.quizSelectedOpt = idx;
      const prev = appState.quizStats[q.id] || { correct: 0, wrong: 0, lastCorrect: false };
      if (idx === q.answer) {
        prev.correct++;
        prev.lastCorrect = true;
      } else {
        prev.wrong++;
        prev.lastCorrect = false;
      }
      appState.quizStats[q.id] = prev;
      saveStateToDB();
      renderApp();
      return;
    }

    const qFilter = e.target.closest("[data-quiz-filter]");
    if (qFilter) {
      appState.quizFilter = qFilter.getAttribute("data-quiz-filter");
      appState.quizIndex = 0;
      appState.quizAnswered = false;
      saveStateToDB();
      renderApp();
      return;
    }

    if (e.target.closest("#btnPrevQuiz")) {
      const list = getFilteredQuizList();
      if (list.length > 0) {
        appState.quizIndex = (appState.quizIndex - 1 + list.length) % list.length;
        appState.quizAnswered = false;
        renderApp();
      }
      return;
    }
    if (e.target.closest("#btnNextQuiz")) {
      const list = getFilteredQuizList();
      if (list.length > 0) {
        appState.quizIndex = (appState.quizIndex + 1) % list.length;
        appState.quizAnswered = false;
        renderApp();
      }
      return;
    }
  });

  const modal = document.getElementById("dataModal");
  document.getElementById("openDataModalBtn").addEventListener("click", () => {
    document.getElementById("confirmResetBox").style.display = "none";
    modal.classList.add("open");
  });
  document.getElementById("closeDataModalBtn").addEventListener("click", () => {
    modal.classList.remove("open");
  });
  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.classList.remove("open");
  });

  document.getElementById("resetBlanksHiddenBtn").addEventListener("click", () => {
    appState.blanks = {};
    saveStateToDB();
    renderApp();
    modal.classList.remove("open");
    showToast("全教科の穴埋めをすべて隠しました");
  });

  document.getElementById("resetBlanksOpenBtn").addEventListener("click", () => {
    ["music", "art"].forEach((sKey) => {
      getAllBlankIdsForSubject(sKey).forEach((id) => {
        appState.blanks[id] = true;
      });
    });
    saveStateToDB();
    renderApp();
    modal.classList.remove("open");
    showToast("全教科の穴埋めをすべて表示しました");
  });

  document.getElementById("reqResetAllBtn").addEventListener("click", () => {
    document.getElementById("confirmResetBox").style.display = "inline-flex";
  });
  document.getElementById("cancelResetAllBtn").addEventListener("click", () => {
    document.getElementById("confirmResetBox").style.display = "none";
  });
  document.getElementById("execResetAllBtn").addEventListener("click", () => {
    appState.blanks = {};
    appState.mastery = {};
    appState.quizStats = {};
    appState.showOnlyUnmastered = false;
    saveStateToDB();
    renderApp();
    document.getElementById("confirmResetBox").style.display = "none";
    modal.classList.remove("open");
    showToast("全データを初期化しました");
  });

  document.getElementById("exportJsonBtn").addEventListener("click", async () => {
    const payload = getPersistPayload();
    const jsonStr = JSON.stringify(payload, null, 2);
    const now = new Date();
    const ymd = now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, "0") +
      String(now.getDate()).padStart(2, "0");
    const fileName = `shidoyoryo_study_backup_${ymd}.json`;

    if (window.location.protocol === "file:" && navigator.canShare) {
      try {
        const file = new File([jsonStr], fileName, { type: "application/json" });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: fileName
          });
          showToast("バックアップを共有しました");
          return;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
    }

    const blob = new Blob([jsonStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(`${fileName} を書き出しました`);
  });

  document.getElementById("importJsonInput").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const parsed = JSON.parse(String(ev.target.result));
        if (parsed && typeof parsed === "object") {
          if (parsed.blanks && typeof parsed.blanks === "object") appState.blanks = parsed.blanks;
          if (parsed.mastery && typeof parsed.mastery === "object") appState.mastery = parsed.mastery;
          if (parsed.quizStats && typeof parsed.quizStats === "object") appState.quizStats = parsed.quizStats;
          if (parsed.activeSubject) appState.activeSubject = parsed.activeSubject;
          if (parsed.activeMode) appState.activeMode = parsed.activeMode;
          await saveStateToDB();
          renderApp();
          modal.classList.remove("open");
          showToast("バックアップデータを復元しました");
        }
      } catch (err) {
        showToast("JSONファイルの読み込みに失敗しました");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });
}

window.addEventListener("DOMContentLoaded", async () => {
  await openStudyDB();
  await loadStateFromDB();
  setupEventListeners();
  renderApp();
});

  </script>
</body>
</html>
