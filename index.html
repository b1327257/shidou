  <title>index</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e40af;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --music-acc: #0284c7;
      --music-bg: #f0f9ff;
      --music-border: #bae6fd;
      --art-acc: #d97706;
      --art-bg: #fffbeb;
      --art-border: #fde68a;
      --math-acc: #4f46e5;
      --math-bg: #eef2ff;
      --math-border: #c7d2fe;
      --foreign-acc: #0d9488;
      --foreign-bg: #f0fdfa;
      --foreign-border: #99f6e4;
      --life-acc: #15803d;
      --life-bg: #f0fdf4;
      --life-border: #bbf7d0;
      --home-acc: #be123c;
      --home-bg: #fff1f2;
      --home-border: #fecdd3;
      --success: #059669;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --blank-hidden-bg: #1e293b;
      --blank-hidden-text: transparent;
      --blank-open-bg: #fef3c7;
      --blank-open-text: #b45309;
      --blank-open-border: #f59e0b;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding-bottom: 64px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      max-width: 1080px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: var(--primary);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #ffffff;
      flex: none;
      box-shadow: 0 2px 4px rgba(29, 78, 216, 0.2);
    }

    .brand-icon svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .brand-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }

    .progress-pill {
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .subject-bar {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 16px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .subject-bar::-webkit-scrollbar {
      display: none;
    }

    .subj-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .subj-tab:hover {
      background: #f8fafc;
      color: var(--text);
    }

    .subj-tab.active-music {
      background: var(--music-acc);
      color: #ffffff;
      border-color: var(--music-acc);
    }

    .subj-tab.active-art {
      background: var(--art-acc);
      color: #ffffff;
      border-color: var(--art-acc);
    }

    .subj-tab.active-math {
      background: var(--math-acc);
      color: #ffffff;
      border-color: var(--math-acc);
    }

    .subj-tab.active-foreign {
      background: var(--foreign-acc);
      color: #ffffff;
      border-color: var(--foreign-acc);
    }

    .subj-tab.active-life {
      background: var(--life-acc);
      color: #ffffff;
      border-color: var(--life-acc);
    }

    .subj-tab.active-home {
      background: var(--home-acc);
      color: #ffffff;
      border-color: var(--home-acc);
    }

    .subj-tab.active-overview {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .subj-slot-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 11px;
      border-radius: 8px;
      border: 1px dashed #cbd5e1;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 600;
      white-space: nowrap;
      background: #f8fafc;
    }

    .main-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 16px 32px;
    }

    .mode-toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mode-btn {
      padding: 7px 13px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: #f1f5f9;
      color: var(--text-sub);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: var(--text);
      color: #ffffff;
    }

    .bulk-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      padding: 6px 11px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    .ctrl-btn.active-filter {
      background: #eff6ff;
      color: var(--primary);
      border-color: var(--primary-border);
    }

    .step-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .step-nav::-webkit-scrollbar {
      display: none;
    }

    .step-pill {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.79rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .step-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .step-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .step-header {
      padding: 14px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .step-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .step-badge {
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #ffffff;
      background: var(--primary);
      flex: none;
    }

    .step-badge.music { background: var(--music-acc); }
    .step-badge.art { background: var(--art-acc); }
    .step-badge.math { background: var(--math-acc); }
    .step-badge.foreign { background: var(--foreign-acc); }
    .step-badge.life { background: var(--life-acc); }
    .step-badge.home { background: var(--home-acc); }

    .step-heading {
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
      color: var(--text);
    }

    .step-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .study-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: #ffffff;
      transition: border-color 0.15s ease;
    }

    .study-card.mastered {
      border-color: var(--success-border);
      background: #fafffd;
    }

    .card-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .source-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      background: #e2e8f0;
      color: #334155;
    }

    .source-tag.honsoku {
      background: #dbeafe;
      color: #1e40af;
    }

    .source-tag.kaisetsu {
      background: #f3e8ff;
      color: #6b21a8;
    }

    .exam-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .card-title {
      font-size: 0.93rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .master-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .master-btn.is-mastered {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    .clause-box {
      font-size: 0.92rem;
      line-height: 1.85;
      color: var(--text);
      background: #f8fafc;
      border-left: 3px solid var(--primary);
      padding: 10px 13px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 8px;
    }

    .clause-box.music-border { border-left-color: var(--music-acc); }
    .clause-box.art-border { border-left-color: var(--art-acc); }
    .clause-box.math-border { border-left-color: var(--math-acc); }
    .clause-box.foreign-border { border-left-color: var(--foreign-acc); }
    .clause-box.life-border { border-left-color: var(--life-acc); }
    .clause-box.home-border { border-left-color: var(--home-acc); }

    .clause-box p {
      margin: 0 0 8px 0;
    }
    .clause-box p:last-child {
      margin-bottom: 0;
    }

    .point-wrap {
      margin-top: 6px;
    }

    .point-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid #fde68a;
      background: #fffbeb;
      color: #92400e;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }

    .point-toggle-btn:hover {
      background: #fef3c7;
    }

    .point-note {
      display: none;
      font-size: 0.82rem;
      color: var(--text-sub);
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 6px;
      line-height: 1.6;
    }

    .point-note.is-open {
      display: block;
    }

    .point-note strong {
      color: #92400e;
    }

    .blank-chip {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      padding: 1px 7px;
      margin: 1px 2px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9em;
      line-height: 1.45;
      cursor: pointer;
      user-select: none;
      vertical-align: baseline;
      border: 1px solid transparent;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .blank-num {
      font-size: 0.75em;
      font-weight: 800;
      padding: 0 4px;
      border-radius: 4px;
      line-height: 1.35;
      flex: none;
    }

    .blank-ans {
      display: inline;
      white-space: pre-wrap;
    }

    .blank-chip.is-hidden {
      background-color: var(--blank-hidden-bg);
      border-color: var(--blank-hidden-bg);
    }

    .blank-chip.is-hidden .blank-num {
      background-color: #334155;
      color: #f8fafc;
    }

    .blank-chip.is-hidden .blank-ans {
      visibility: hidden;
    }

    .blank-chip.is-open {
      background-color: var(--blank-open-bg);
      border-color: var(--blank-open-border);
    }

    .blank-chip.is-open .blank-num {
      background-color: #f59e0b;
      color: #ffffff;
    }

    .blank-chip.is-open .blank-ans {
      visibility: visible;
      color: var(--blank-open-text);
    }

    .matrix-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .matrix-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
      font-size: 0.86rem;
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      vertical-align: top;
      text-align: left;
      line-height: 1.7;
    }

    .matrix-table th {
      background: #f1f5f9;
      font-weight: 700;
      color: var(--text);
    }

    .matrix-table td.row-label {
      background: #f8fafc;
      font-weight: 700;
      width: 140px;
      color: var(--text-sub);
    }

    .quiz-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .quiz-header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .quiz-q-box {
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.75;
      margin-bottom: 14px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .quiz-opt-btn {
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.55;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .quiz-opt-btn:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .quiz-opt-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: #065f46;
    }

    .quiz-opt-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: #991b1b;
    }

    .quiz-feedback {
      padding: 13px 15px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      font-size: 0.86rem;
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .subj-summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .subj-summary-card.future-slot {
      background: #f8fafc;
      border-style: dashed;
      opacity: 0.85;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      place-items: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: grid;
    }

    .modal-panel {
      background: #ffffff;
      border-radius: 14px;
      max-width: 460px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
    }

    .modal-title {
      font-size: 1.02rem;
      font-weight: 700;
      margin: 0 0 12px 0;
    }

    .modal-section {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast-msg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #ffffff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      z-index: 120;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .toast-msg.show {
      opacity: 1;
    }

    @media (max-width: 640px) {
      .header-top { padding: 8px 12px; }
      .main-container { padding: 10px 12px 28px; }
      .step-header { padding: 12px; }
      .step-body { padding: 12px; }
      .study-card { padding: 12px; }
    }
  
    /* ブランドサブタイトル（元のクリーンな見た目を維持） */
    .brand-titles {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .brand-sub {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.15;
      letter-spacing: 0.02em;
    }

    /* 概要バナー（元のデザインそのまま） */
    .overview-banner {
      background: #ffffff;
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 分散復習タブのアクティブ状態＆バッジ */
    .subj-tab.active-due {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }
    .due-count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--danger);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1;
    }
    .subj-tab.active-due .due-count-badge {
      background: #ffffff;
      color: #0284c7;
    }

    /* ★スマホでもタイトルが絶対に潰れない元の縦積みカードヘッダー★ */
    .card-header-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    .card-ctrl-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
    }
    .card-ctrl-left,
    .card-ctrl-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* 3段階習得ボタン（元の .master-btn のデザインを継承） */
    .master-btn.is-learning {
      background: #e0f2fe;
      color: #0369a1;
      border-color: #7dd3fc;
    }

    /* 次回予定ラベル */
    .next-due-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--text-sub);
      border: 1px solid var(--border);
    }
    .next-due-tag.is-due {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: var(--danger-border);
    }

    /* カード個別開閉・テストボタン */
    .card-act-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .card-act-btn:hover {
      background: #f1f5f9;
      color: var(--text);
    }
    .card-test-trigger {
      padding: 4px 11px;
      border-radius: 999px;
      border: 1px solid var(--primary);
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .card-test-trigger:hover {
      background: var(--primary);
      color: #ffffff;
    }
    .card-test-trigger.is-active {
      background: var(--primary);
      color: #ffffff;
    }

    /* カード内テストモード枠 */
    .study-card.testing-mode {
      border: 2px solid var(--primary);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }
    .test-guide-bar {
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      color: var(--primary-dark);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .test-submit-bar {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .test-main-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .test-reveal-btn {
      flex: 1;
      min-width: 140px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
    .test-reveal-btn:hover {
      background: #f8fafc;
    }
    .test-finish-btn {
      flex: 1.5;
      min-width: 180px;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--success);
      background: var(--success);
      color: #ffffff;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
    }
    .test-finish-btn:hover {
      opacity: 0.92;
    }
    .test-grade-Row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    @media (max-width: 480px) {
      .test-grade-Row {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .grade-quick-btn {
      padding: 8px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.12s ease;
    }
    .grade-quick-btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }
    .grade-btn-main {
      font-size: 0.8rem;
      font-weight: 800;
      line-height: 1.2;
    }
    .grade-btn-sub {
      font-size: 0.68rem;
      font-weight: 700;
      opacity: 0.9;
      line-height: 1.2;
    }
    .grade-btn-next {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      margin-top: 2px;
      background: rgba(15, 23, 42, 0.05);
      color: var(--text-sub);
    }
    .grade-quick-btn.g1 { color: var(--danger); border-color: var(--danger-border); background: #fff5f5; }
    .grade-quick-btn.g1 .grade-btn-next { background: #fee2e2; color: #b91c1c; }
    .grade-quick-btn.g2 { color: #b45309; border-color: #fde68a; background: #fffbeb; }
    .grade-quick-btn.g2 .grade-btn-next { background: #fef3c7; color: #92400e; }
    .grade-quick-btn.g3 { color: var(--primary); border-color: var(--primary-border); background: #eff6ff; }
    .grade-quick-btn.g3 .grade-btn-next { background: #dbeafe; color: #1e40af; }
    .grade-quick-btn.g4 { color: var(--success); border-color: var(--success-border); background: #ecfdf5; }
    .grade-quick-btn.g4 .grade-btn-next { background: #d1fae5; color: #065f46; }

    /* 定着済み穴埋めの自動開示（虫食いフォーカス時） */
    .blank-chip.is-auto-open {
      background-color: #ecfdf5;
      border-color: #a7f3d0;
    }
    .blank-chip.is-auto-open .blank-num {
      background-color: #10b981;
      color: #ffffff;
    }
    .blank-chip.is-auto-open .blank-ans {
      visibility: visible;
      color: #065f46;
    }

    /* =========================================================
     * 🧠 分散復習タブ専用レイアウト（iPad & スマホ完全対応・歪みゼロ）
     * ========================================================= */
    .sr-hero-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .sr-hero-count {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
      margin: 6px 0 10px;
    }
    .sr-hero-count span {
      font-size: 1.1rem;
      color: var(--text-sub);
      margin-left: 4px;
    }
    .sr-start-btn {
      width: 100%;
      max-width: 400px;
      padding: 13px 20px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.22);
      transition: all 0.15s ease;
    }
    .sr-start-btn:hover:not(:disabled) {
      background: var(--primary-dark);
    }
    .sr-start-btn:disabled {
      background: #e2e8f0;
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* iPad横並び・スマホ縦並びの2カラムグリッド */
    .sr-two-col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }
    @media (max-width: 768px) {
      .sr-two-col-grid {
        grid-template-columns: 1fr;
      }
    }
    .sr-panel {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .sr-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.95rem;
      font-weight: 800;
    }
    /* iPadでも絶対に引き伸ばされないSVGコンテナ */
    .sr-curve-box {
      width: 100%;
      max-width: 480px;
      margin: 0 auto 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 10px 6px;
    }
    .sr-forecast-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .sr-forecast-cell {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 2px;
      text-align: center;
    }
    .sr-forecast-cell.is-today {
      background: var(--primary-light);
      border-color: var(--primary-border);
    }
    .sr-forecast-day {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .sr-forecast-cell.is-today .sr-forecast-day {
      color: var(--primary);
    }
    .sr-forecast-num {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
    }
    .sr-forecast-cell.is-today .sr-forecast-num {
      color: var(--primary);
    }

  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="brand-wrap">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            <path d="m15.2 11.2 1.8 1.8 3.2-3.5"></path>
            <path d="M5.2 8.5h3.3"></path>
            <path d="M5.2 12.5h3.3"></path>
          </svg>
        </div>
        <div class="brand-titles">
          <span class="brand-sub">小学校教員資格認定試験対策</span>
          <h1 class="brand-title">指導要領・解説 体系学習</h1>
        </div>
      </div>
      <div class="header-actions">
        <span id="headerProgressPill" class="progress-pill">全体 習得 0/75</span>
        <button type="button" id="openDataModalBtn" class="icon-btn" aria-label="データ管理">
          <svg viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>データ管理</span>
        </button>
      </div>
    </div>

    <nav class="subject-bar" aria-label="教科選択">
      <button type="button" class="subj-tab" data-subject="overview" id="tabSubjOverview">📊 ダッシュボード</button>
      <button type="button" class="subj-tab" data-subject="dueReview" id="tabSubjDueReview">🧠 分散復習 <span id="navDueBadge" class="due-count-badge" style="display:none;">0</span></button>
      <button type="button" class="subj-tab" data-subject="music" id="tabSubjMusic">🎵 音楽</button>
      <button type="button" class="subj-tab" data-subject="art" id="tabSubjArt">🎨 図画工作</button>
      <button type="button" class="subj-tab" data-subject="math" id="tabSubjMath">📐 算数</button>
      <button type="button" class="subj-tab" data-subject="foreign" id="tabSubjForeign">🌐 外国語</button>
      <button type="button" class="subj-tab" data-subject="life" id="tabSubjLife">🌱 生活</button>
      <button type="button" class="subj-tab" data-subject="home" id="tabSubjHome">🍳 家庭</button>
    </nav>

// 連番マップ構築（元の仕様どおり：各教科の体系学習とマトリクスでそれぞれ1から連番）
const BLANK_SEQ_MAP = {};
function buildBlankSeqMap() {
  const re = /\{\{([a-zA-Z0-9_]+)\|([^}]+)\}\}/g;
  Object.keys(SUBJECT_DATA).forEach((sKey) => {
    const subj = SUBJECT_DATA[sKey];
    let stepCounter = 1;
    subj.steps.forEach((st) => {
      st.items.forEach((it) => {
        it.clauses.forEach((c) => {
          let m;
          while ((m = re.exec(c)) !== null) {
            if (!BLANK_SEQ_MAP[m[1]]) {
              BLANK_SEQ_MAP[m[1]] = stepCounter++;
            }
          }
        });
      });
    });
    let matrixCounter = 1;
    subj.matrices.forEach((mat) => {
      mat.rows.forEach((r) => {
        r.forEach((cell) => {
          let m;
          while ((m = re.exec(cell)) !== null) {
            if (!BLANK_SEQ_MAP[m[1]]) {
              BLANK_SEQ_MAP[m[1]] = matrixCounter++;
            }
          }
        });
      });
    });
  });
}
buildBlankSeqMap();

/* =========================================================

function getLocalDateString(d) {
  d = d || new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function addDaysToDateString(dateStr, days) {
  const p = dateStr.split("-");
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  d.setDate(d.getDate() + days);
  return getLocalDateString(d);
}

function diffDaysBetween(aStr, bStr) {
  const pA = aStr.split("-");
  const dA = new Date(Number(pA[0]), Number(pA[1]) - 1, Number(pA[2]));
  const pB = bStr.split("-");
  const dB = new Date(Number(pB[0]), Number(pB[1]) - 1, Number(pB[2]));
  return Math.round((dA.getTime() - dB.getTime()) / (1000 * 60 * 60 * 24));
}

function getCardRecord(cardId, subjectKey, title) {
  if (!appState.spacedCards[cardId]) {
    const isOldMastered = Boolean(appState.mastery[cardId]);
    appState.spacedCards[cardId] = {
      id: cardId,
      subject: subjectKey || "music",
      title: title || cardId,
      status: isOldMastered ? "mastered" : "unlearned", // 'unlearned' | 'learning' | 'mastered'
      repetition: 0,
      interval: 0,
      efactor: 2.5,
      nextReviewDate: null,
      lastReviewedAt: null,
      lastScore: null,
      blankStats: {}
    };
  }
  return appState.spacedCards[cardId];
}

function calculateSchedule(card, grade, todayStr) {
  const prevRep = Number(card.repetition || 0);
  const prevInterval = Number(card.interval || 0);
  const prevEF = Number(card.efactor || 2.5);

  let overdueDays = 0;
  if (card.nextReviewDate && todayStr && card.nextReviewDate < todayStr) {
    overdueDays = Math.max(0, diffDaysBetween(todayStr, card.nextReviewDate));
  }

  let newRep = prevRep;
  let newInterval = 0;
  let newEF = prevEF;

  if (grade === 1) {
    newEF = Math.max(1.3, prevEF - 0.20);
    newRep = 0;
    newInterval = 0;
  } else if (grade === 2) {
    newEF = Math.max(1.3, prevEF - 0.15);
    if (prevRep === 0) newInterval = 1;
    else if (prevRep === 1) newInterval = Math.max(3, prevInterval + 1);
    else newInterval = Math.max(prevInterval + 1, Math.round(prevInterval * 1.2));
    newRep = prevRep + 1;
  } else if (grade === 3) {
    newEF = prevEF;
    if (prevRep === 0) newInterval = 3;
    else if (prevRep === 1) {
      const baseGood = 6;
      newInterval = overdueDays > 0 ? Math.max(baseGood, Math.round((prevInterval + overdueDays * 0.5) * newEF)) : baseGood;
    } else {
      newInterval = Math.max(prevInterval + 1, Math.round((prevInterval + overdueDays * 0.5) * newEF));
    }
    newRep = prevRep + 1;
  } else {
    newEF = Math.min(3.0, prevEF + 0.15);
    if (prevRep === 0) newInterval = 4;
    else if (prevRep === 1) {
      const baseEasy = 10;
      newInterval = overdueDays > 0 ? Math.max(baseEasy, Math.round((prevInterval + overdueDays) * newEF * 1.3)) : baseEasy;
    } else {
      newInterval = Math.max(prevInterval + 2, Math.round((prevInterval + overdueDays) * newEF * 1.3));
    }
    newRep = prevRep + 1;
  }

  newEF = Math.round(newEF * 100) / 100;
  if (newInterval > 365) newInterval = 365;

  const nextDate = (grade === 1) ? todayStr : addDaysToDateString(todayStr, newInterval);
  return {
    repetition: newRep,
    interval: newInterval,
    efactor: newEF,
    nextReviewDate: nextDate,
    lastScore: grade,
    lastReviewedAt: new Date().toISOString()
  };
}

function estimateCardRetention(card, todayStr) {
  const s = Math.max(0.8, Number(card.interval || 0) || 0.8);
  let elapsed = 0;
  if (card.lastReviewedAt) {
    elapsed = Math.max(0, diffDaysBetween(todayStr, getLocalDateString(new Date(card.lastReviewedAt))));
  } else if (card.nextReviewDate) {
    const scheduledStart = addDaysToDateString(card.nextReviewDate, -Math.max(1, Number(card.interval || 1)));
    elapsed = Math.max(0, diffDaysBetween(todayStr, scheduledStart));
  }
  const r = Math.exp(-elapsed / (s * 4.5));
  return Math.max(0.05, Math.min(1, r));
}

function getDueCards(todayStr, subjectFilter) {
  const list = [];
  Object.keys(appState.spacedCards).forEach((cid) => {
    const c = appState.spacedCards[cid];
    if (!c.nextReviewDate) return;
    if (c.nextReviewDate <= todayStr) {
      if (!subjectFilter || subjectFilter === "all" || c.subject === subjectFilter) {
        list.push(c);
      }
    }
  });
  return list.sort((a, b) => {
    if (a.nextReviewDate !== b.nextReviewDate) {
      return a.nextReviewDate < b.nextReviewDate ? -1 : 1;
    }
    return (a.interval || 0) - (b.interval || 0);
  });
}

/* =========================================================
 * IndexedDB ＆ localStorage 保存
 * ========================================================= */
let dbInstance = null;

function openStudyDB() {
  return new Promise((resolve) => {
    if (!window.indexedDB) {
      resolve(null);
      return;
    }
    try {
      const req = window.indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("kv")) {
          db.createObjectStore("kv");
        }
      };
      req.onsuccess = (e) => {
        dbInstance = e.target.result;
        resolve(dbInstance);
      };
      req.onerror = () => resolve(null);
    } catch (err) {
      resolve(null);
    }
  });
}

function getPersistPayload() {
  return {
    activeSubject: appState.activeSubject,
    activeMode: appState.activeMode,
    activeStepId: appState.activeStepId,
    showOnlyUnmastered: appState.showOnlyUnmastered,
    adaptiveFocusEnabled: appState.adaptiveFocusEnabled,
    quizFilter: appState.quizFilter,
    blanks: appState.blanks,
    mastery: appState.mastery,
    spacedCards: appState.spacedCards,
    quizStats: appState.quizStats,
    savedAt: new Date().toISOString()
  };
}

async function saveStateToDB() {
  const payload = getPersistPayload();
  try {
    localStorage.setItem(FALLBACK_KEY, JSON.stringify(payload));
  } catch (e) {}

  if (!dbInstance) return;
  return new Promise((resolve) => {
    try {
      const tx = dbInstance.transaction("kv", "readwrite");
      tx.objectStore("kv").put(payload, "rootState");
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    } catch (e) {
      resolve(false);
    }
  });
}

async function loadStateFromDB() {
  let loaded = null;
  if (dbInstance) {
    loaded = await new Promise((resolve) => {
      try {
        const tx = dbInstance.transaction("kv", "readonly");
        const req = tx.objectStore("kv").get("rootState");
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      } catch (e) {
        resolve(null);
      }
    });
  }
  if (!loaded) {
    try {
      const raw = localStorage.getItem(FALLBACK_KEY);
      if (raw) loaded = JSON.parse(raw);
    } catch (e) {}
  }

  if (loaded && typeof loaded === "object") {
    if (loaded.activeSubject) appState.activeSubject = loaded.activeSubject;
    if (loaded.activeMode) appState.activeMode = loaded.activeMode;
    if (loaded.activeStepId) appState.activeStepId = loaded.activeStepId;
    if (typeof loaded.showOnlyUnmastered === "boolean") appState.showOnlyUnmastered = loaded.showOnlyUnmastered;
    if (typeof loaded.adaptiveFocusEnabled === "boolean") appState.adaptiveFocusEnabled = loaded.adaptiveFocusEnabled;
    if (loaded.quizFilter) appState.quizFilter = loaded.quizFilter;
    if (loaded.blanks && typeof loaded.blanks === "object") appState.blanks = loaded.blanks;
    if (loaded.mastery && typeof loaded.mastery === "object") appState.mastery = loaded.mastery;
    if (loaded.spacedCards && typeof loaded.spacedCards === "object") appState.spacedCards = loaded.spacedCards;
    if (loaded.quizStats && typeof loaded.quizStats === "object") appState.quizStats = loaded.quizStats;
  }

  // 全教科カードのレコード保証
  Object.keys(SUBJECT_DATA).forEach((sKey) => {
    const subj = SUBJECT_DATA[sKey];
    subj.steps.forEach((st) => {
      st.items.forEach((it) => {
        const rec = getCardRecord(it.id, sKey, it.title);
        rec.subject = sKey;
        rec.title = it.title;
        if (appState.mastery[it.id] && rec.status === "unlearned") {
          rec.status = "mastered";
        }
      });
    });
  });
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function isBlankAutoFocused(cardId, blankId) {
  if (!appState.adaptiveFocusEnabled) return false;
  const c = appState.spacedCards[cardId];
  if (!c || !c.blankStats) return false;
  const bStat = c.blankStats[blankId];
  if (bStat && bStat.correct >= 2 && (c.interval || 0) >= 6) {
    return true;
  }
  return false;
}

function renderTextWithBlanks(rawText, activeTestCardId = null) {
  const escaped = escapeHtml(rawText).replace(/\n/g, "<br>");
  return escaped.replace(/\{\{([a-zA-Z0-9_]+)\|([^}]+)\}\}/g, (_, blankId, answerText) => {
    const seqNum = BLANK_SEQ_MAP[blankId] || "";
    const isTesting = Boolean(activeTestCardId);

    let isRevealed = false;
    let isAutoOpen = false;

    if (isTesting) {
      if (appState.testCardBlanks[blankId] !== undefined) {
        isRevealed = appState.testCardBlanks[blankId];
      } else {
        if (isBlankAutoFocused(activeTestCardId, blankId)) {
          isRevealed = true;
          isAutoOpen = true;
          appState.testCardBlanks[blankId] = true;
        } else {
          isRevealed = false;
          appState.testCardBlanks[blankId] = false;
        }
      }
    } else {
      isRevealed = Boolean(appState.blanks[blankId]);
    }

    const stateClass = isRevealed ? (isAutoOpen ? "is-auto-open" : "is-open") : "is-hidden";
    return `<button type="button" class="blank-chip ${stateClass}" data-blank-id="${blankId}" ${isTesting ? `data-test-card-id="${activeTestCardId}"` : ""} aria-pressed="${isRevealed}"><span class="blank-num">${seqNum}</span><span class="blank-ans">${answerText}</span></button>`;
  });
}

function extractBlankIdsFromText(rawText) {
  const ids = [];
  const re = /\{\{([a-zA-Z0-9_]+)\|([^}]+)\}\}/g;
  let m;
  while ((m = re.exec(rawText)) !== null) {
    ids.push(m[1]);
  }
  return ids;
}

function getAllBlankIdsForSubject(subjKey) {
  const ids = [];
  const subj = SUBJECT_DATA[subjKey];
  if (!subj) return ids;
  subj.steps.forEach((st) => {
    st.items.forEach((it) => {
      it.clauses.forEach((c) => {
        ids.push(...extractBlankIdsFromText(c));
      });
    });
  });
  subj.matrices.forEach((mat) => {
    mat.rows.forEach((r) => {
      r.forEach((cell) => {
        ids.push(...extractBlankIdsFromText(cell));
      });
    });
  });
  return ids;
}

function getSubjectStats(subjKey) {
  const subj = SUBJECT_DATA[subjKey];
  let totalItems = 0;
  let masteredItems = 0;
  let learningItems = 0;
  subj.steps.forEach((st) => {
    st.items.forEach((it) => {
      totalItems++;
      const c = getCardRecord(it.id, subjKey, it.title);
      if (c.status === "mastered") masteredItems++;
      else if (c.status === "learning") learningItems++;
    });
  });
  const blankIds = getAllBlankIdsForSubject(subjKey);
  const totalBlanks = blankIds.length;
  let openBlanks = 0;
  blankIds.forEach((id) => {
    if (appState.blanks[id]) openBlanks++;
  });
  return { totalItems, masteredItems, learningItems, totalBlanks, openBlanks };
}

  toastTimer = setTimeout(() => {

  }, 2000);
}

function renderCardScheduleTag(cardId) {
  const c = appState.spacedCards[cardId];
  if (!c || !c.nextReviewDate) return "";
  const todayStr = getLocalDateString();
  const diff = diffDaysBetween(c.nextReviewDate, todayStr);
  if (diff < 0) {
    return `<span class="next-due-tag is-due">期限超過 (${Math.abs(diff)}日)</span>`;
  } else if (diff === 0) {
    return `<span class="next-due-tag is-due">本日復習</span>`;
  } else if (diff === 1) {
    return `<span class="next-due-tag">次回: 明日</span>`;
  } else {
    return `<span class="next-due-tag">次回: ${diff}日後</span>`;
  }
}

/* =========================================================
 * 🧠 分散復習タブ（忘却曲線・7日間予測・復習セッションを集約）
 * ========================================================= */
function buildForgettingCurveSvgAndForecast(todayStr) {
  const allCards = Object.values(appState.spacedCards);
  const activeCards = allCards.filter((c) => c.nextReviewDate || c.status !== "unlearned");
  const total = activeCards.length;

  let sumR = 0;
  const initCards = [];
  const learnCards = [];
  const masterCards = [];

  activeCards.forEach((c) => {
    const r = estimateCardRetention(c, todayStr);
    sumR += r;
    const iv = Number(c.interval || 0);
    if (iv > 21) masterCards.push(c);
    else if (iv >= 4) learnCards.push(c);
    else initCards.push(c);
  });

  const avgRetentionText = total === 0 ? "平均保持率 --%" : `現在保持率 ${Math.round((sumR / total) * 100)}%`;

  const avgS = (arr, fallbackS) => {
    if (arr.length === 0) return fallbackS;
    let sum = 0;
    arr.forEach((c) => { sum += Math.max(1, Number(c.interval || 1)); });
    return sum / arr.length;
  };

  const sInit = avgS(initCards, 1.5);
  const sLearn = avgS(learnCards, 10);
  const sMaster = avgS(masterCards, 45);

  const x0 = 32, x1 = 308, yTop = 14, yBot = 122;
  const w = x1 - x0;
  const h = yBot - yTop;
  const maxDays = 30;

  function buildCurvePath(stabilityDays) {
    const tau = stabilityDays * 3.2;
    const pts = [];
    for (let d = 0; d <= maxDays; d += 1) {
      const ret = Math.exp(-d / tau);
      const px = x0 + (d / maxDays) * w;
      const py = yBot - ret * h;
      pts.push((d === 0 ? "M " : "L ") + px.toFixed(1) + " " + py.toFixed(1));
    }
    return pts.join(" ");
  }

  const y80 = (yBot - 0.8 * h).toFixed(1);
  const y50 = (yBot - 0.5 * h).toFixed(1);

  let svgInner = "";
  svgInner += `<line x1="${x0}" y1="${yTop}" x2="${x1}" y2="${yTop}" stroke="#e2e8f0" stroke-width="1" />`;
  svgInner += `<line x1="${x0}" y1="${y80}" x2="${x1}" y2="${y80}" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" />`;
  svgInner += `<line x1="${x0}" y1="${y50}" x2="${x1}" y2="${y50}" stroke="#e2e8f0" stroke-width="1" />`;
  svgInner += `<line x1="${x0}" y1="${yBot}" x2="${x1}" y2="${yBot}" stroke="#e2e8f0" stroke-width="1" />`;

  svgInner += `<text x="2" y="${yTop + 4}" font-size="9.5" font-weight="700" fill="#64748b">100%</text>`;
  svgInner += `<text x="6" y="${Number(y80) + 3}" font-size="9.5" font-weight="700" fill="#1d4ed8">80%</text>`;
  svgInner += `<text x="6" y="${Number(y50) + 3}" font-size="9.5" font-weight="700" fill="#64748b">50%</text>`;
  svgInner += `<text x="12" y="${yBot + 3}" font-size="9.5" font-weight="700" fill="#64748b">0%</text>`;

  [0, 7, 14, 21, 30].forEach((dayVal) => {
    const gx = (x0 + (dayVal / maxDays) * w).toFixed(1);
    svgInner += `<line x1="${gx}" y1="${yTop}" x2="${gx}" y2="${yBot}" stroke="#e2e8f0" stroke-width="0.7" />`;
    svgInner += `<text x="${gx}" y="${yBot + 15}" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">${dayVal}日</text>`;
  });

  svgInner += `<path d="${buildCurvePath(sInit)}" fill="none" stroke="#f59e0b" stroke-width="2.3" stroke-linecap="round" />`;
  svgInner += `<path d="${buildCurvePath(sLearn)}" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />`;
  svgInner += `<path d="${buildCurvePath(sMaster)}" fill="none" stroke="#16a34a" stroke-width="2.7" stroke-linecap="round" />`;

  activeCards.slice(0, 40).forEach((c) => {
    const iv = Number(c.interval || 0);
    const sGroup = iv > 21 ? sMaster : (iv >= 4 ? sLearn : sInit);
    const dotColor = iv > 21 ? "#16a34a" : (iv >= 4 ? "#0284c7" : "#f59e0b");
    let elapsed = 0;
    if (c.lastReviewedAt) {
      elapsed = Math.max(0, Math.min(maxDays, diffDaysBetween(todayStr, getLocalDateString(new Date(c.lastReviewedAt)))));
    }
    const ret = Math.exp(-elapsed / (sGroup * 3.2));
    const cx = (x0 + (elapsed / maxDays) * w).toFixed(1);
    const cy = (yBot - ret * h).toFixed(1);
    svgInner += `<circle cx="${cx}" cy="${cy}" r="3.2" fill="${dotColor}" stroke="#ffffff" stroke-width="1" />`;
  });

  const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
  let forecastHtml = "";
  for (let offset = 0; offset < 7; offset++) {
    const targetDateStr = addDaysToDateString(todayStr, offset);
    let count = 0;
    if (offset === 0) {
      count = allCards.filter((c) => c.nextReviewDate && c.nextReviewDate <= todayStr).length;
    } else {
      count = allCards.filter((c) => c.nextReviewDate === targetDateStr).length;
    }
    const p = targetDateStr.split("-");
    const dObj = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    const dayLabel = offset === 0 ? "今日" : (offset === 1 ? "明日" : `${Number(p[2])}日(${weekDays[dObj.getDay()]})`);

    forecastHtml += `
      <div class="sr-forecast-cell ${offset === 0 ? "is-today" : ""}">
        <div class="sr-forecast-day">${dayLabel}</div>
        <div class="sr-forecast-num">${count}</div>
      </div>
    `;
  }

  return { avgRetentionText, svgInner, forecastHtml, initCount: initCards.length, learnCount: learnCards.length, masterCount: masterCards.length };
}

function renderApp() {
  updateHeaderAndTabs();
  const area = document.getElementById("appContentArea");
  if (appState.activeSubject === "overview") {
    area.innerHTML = renderOverviewDashboard();
    return;
  }
  if (appState.activeSubject === "dueReview") {
    area.innerHTML = renderDueReviewView();
    return;
  }

  const subj = SUBJECT_DATA[appState.activeSubject] || SUBJECT_DATA.music;
  renderStepNav(subj);

  if (appState.activeMode === "steps") {
    area.innerHTML = renderStepsView(subj);
  } else if (appState.activeMode === "matrix") {
    area.innerHTML = renderMatrixView(subj);
  } else {
    area.innerHTML = renderQuizView();
  }
}

/* =========================================================
 * テスト採点＆SM-2更新
 * ========================================================= */
function applyCardReviewGrade(cardId, grade, isDueSession) {
  const c = getCardRecord(cardId, appState.activeSubject);
  const todayStr = getLocalDateString();
  const res = calculateSchedule(c, grade, todayStr);

  c.repetition = res.repetition;
  c.interval = res.interval;
  c.efactor = res.efactor;
  c.nextReviewDate = res.nextReviewDate;
  c.lastScore = res.lastScore;
  c.lastReviewedAt = res.lastReviewedAt;

  if (grade === 1) {
    c.status = "learning";
    appState.mastery[cardId] = false;
  } else if (grade >= 3 && (c.interval >= 10 || c.repetition >= 2)) {
    c.status = "mastered";
    appState.mastery[cardId] = true;
  } else {
    c.status = "learning";
    appState.mastery[cardId] = false;
  }

  saveStateToDB();

  let nextLabel = "";
  if (grade === 1) nextLabel = "本日再確認";
  else if (res.interval === 1) nextLabel = "次回: 明日";
  else nextLabel = `次回: ${res.interval}日後`;

  showToast(`復習登録完了（${nextLabel}）`);

  if (isDueSession) {
    appState.testCardBlanks = {};
    const remaining = getDueCards(todayStr, appState.dueSubjectFilter);
    if (remaining.length === 0) {
      appState.dueSessionActive = false;
    } else if (appState.dueIndex >= remaining.length) {
      appState.dueIndex = 0;
    }
    renderApp();
  } else {
    appState.activeTestCardId = null;
    appState.testCardBlanks = {};
    renderApp();
  }
}

/* =========================================================
 * イベントリスナー
 * ========================================================= */
function setupEventListeners() {
  document.querySelectorAll(".subj-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      const targetSubj = btn.getAttribute("data-subject");
      if (!targetSubj) return;
      appState.activeSubject = targetSubj;
      appState.activeStepId = "all";
      appState.activeTestCardId = null;
      appState.testCardBlanks = {};
      appState.dueSessionActive = false;
      appState.quizIndex = 0;
      appState.quizAnswered = false;
      saveStateToDB();
      renderApp();
    });
  });

  document.querySelectorAll(".mode-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const mode = btn.getAttribute("data-mode");
      if (!mode) return;
      appState.activeMode = mode;
      appState.activeTestCardId = null;
      appState.testCardBlanks = {};
      appState.quizIndex = 0;
      appState.quizAnswered = false;
      saveStateToDB();
      renderApp();
    });
  });

  document.getElementById("btnHideAllVisible").addEventListener("click", () => {
    const chips = document.querySelectorAll("#appContentArea .blank-chip");
    chips.forEach((chip) => {
      const id = chip.getAttribute("data-blank-id");
      if (id) appState.blanks[id] = false;
    });
    saveStateToDB();
    renderApp();
    showToast("表示中の穴埋めをすべて隠しました");
  });

  document.getElementById("btnShowAllVisible").addEventListener("click", () => {
    const chips = document.querySelectorAll("#appContentArea .blank-chip");
    chips.forEach((chip) => {
      const id = chip.getAttribute("data-blank-id");
      if (id) appState.blanks[id] = true;
    });
    saveStateToDB();
    renderApp();
    showToast("表示中の穴埋めをすべて表示しました");
  });

  document.getElementById("btnToggleUnmastered").addEventListener("click", () => {
    appState.showOnlyUnmastered = !appState.showOnlyUnmastered;
    saveStateToDB();
    renderApp();
  });

  document.getElementById("btnToggleAdaptiveFocus").addEventListener("click", () => {
    appState.adaptiveFocusEnabled = !appState.adaptiveFocusEnabled;
    saveStateToDB();
    updateHeaderAndTabs();
    showToast(`自動穴埋め調整を ${appState.adaptiveFocusEnabled ? "ON" : "OFF"} にしました`);
  });

  document.getElementById("stepNavContainer").addEventListener("click", (e) => {
    const pill = e.target.closest("[data-step-id]");
    if (!pill) return;
    appState.activeStepId = pill.getAttribute("data-step-id");
    appState.activeTestCardId = null;
    saveStateToDB();
    renderApp();
  });

  document.getElementById("appContentArea").addEventListener("click", (e) => {
    // 1. 穴埋めチップのタップ開閉
    const chip = e.target.closest(".blank-chip");
    if (chip) {
      const blankId = chip.getAttribute("data-blank-id");
      if (!blankId) return;
      const testCardId = chip.getAttribute("data-test-card-id");

      if (testCardId) {
        const nextState = !Boolean(appState.testCardBlanks[blankId]);
        appState.testCardBlanks[blankId] = nextState;
        chip.classList.toggle("is-open", nextState);
        chip.classList.toggle("is-hidden", !nextState);
        chip.classList.remove("is-auto-open");
        chip.setAttribute("aria-pressed", String(nextState));
      } else {
        const nextState = !Boolean(appState.blanks[blankId]);
        appState.blanks[blankId] = nextState;
        chip.classList.toggle("is-open", nextState);
        chip.classList.toggle("is-hidden", !nextState);
        chip.setAttribute("aria-pressed", String(nextState));
        saveStateToDB();
      }
      return;
    }

    // 2. カード別「隠す」「表示」
    const cardBulk = e.target.closest("[data-card-bulk]");
    if (cardBulk) {
      const action = cardBulk.getAttribute("data-card-bulk");
      const cardEl = cardBulk.closest(".study-card");
      if (cardEl) {
        const shouldReveal = (action === "show");
        cardEl.querySelectorAll(".blank-chip").forEach((c) => {
          const bid = c.getAttribute("data-blank-id");
          if (bid) appState.blanks[bid] = shouldReveal;
        });
        saveStateToDB();
        renderApp();
      }
      return;
    }

    // 3. カード別「🎯 テスト」起動
    const testBtn = e.target.closest("[data-card-test]");
    if (testBtn) {
      const cardId = testBtn.getAttribute("data-card-test");
      if (appState.activeTestCardId === cardId) {
        appState.activeTestCardId = null;
        appState.testCardBlanks = {};
      } else {
        appState.activeTestCardId = cardId;
        appState.testCardBlanks = {};
      }
      renderApp();
      return;
    }

    // 4. テスト中断
    const cancelBtn = e.target.closest("[data-test-cancel]");
    if (cancelBtn) {
      appState.activeTestCardId = null;
      appState.testCardBlanks = {};
      renderApp();
      return;
    }

    // 5. テスト内「💡 すべて開けて答え合わせ」
    const revealAllBtn = e.target.closest("[data-test-reveal-all]");
    if (revealAllBtn) {
      const cardEl = revealAllBtn.closest(".study-card");
      if (cardEl) {
        cardEl.querySelectorAll(".blank-chip").forEach((b) => {
          const bid = b.getAttribute("data-blank-id");
          if (bid) {
            appState.testCardBlanks[bid] = true;
            b.classList.remove("is-hidden", "is-auto-open");
            b.classList.add("is-open");
          }
        });
      }
      showToast("すべて開けました。間違えた箇所だけタップして黒塗りに戻してください");
      return;
    }

    // 4段階評価ボタン（★穴埋めの黒塗り正誤を自動集計してスケジュール登録を即時完了★）
    const gradeBtn = e.target.closest("[data-test-grade]");
    if (gradeBtn) {
      const grade = Number(gradeBtn.getAttribute("data-test-grade"));
      const cardId = gradeBtn.getAttribute("data-card-id");
      const isDueSession = Boolean(gradeBtn.getAttribute("data-is-due-session"));
      const cardEl = gradeBtn.closest(".study-card");

      // カード内の穴埋めの正誤を自動集計（開＝正解、黒塗り＝不正解）
      if (cardEl) {
        const c = getCardRecord(cardId, appState.activeSubject);
        if (!c.blankStats) c.blankStats = {};
        cardEl.querySelectorAll(".blank-chip").forEach((b) => {
          const bid = b.getAttribute("data-blank-id");
          if (bid) {
            const isOpen = Boolean(appState.testCardBlanks[bid]);
            if (!c.blankStats[bid]) c.blankStats[bid] = { correct: 0, wrong: 0 };
            if (isOpen) {
              c.blankStats[bid].correct++;
            } else {
              c.blankStats[bid].wrong++;
            }
          }
        });
      }

      applyCardReviewGrade(cardId, grade, isDueSession);
      return;
    }

    // 8. 3段階ステータス切替（未習得 ➔ 進行中 ➔ 習得済み）
    const masterBtn = e.target.closest("[data-toggle-master]");
    if (masterBtn) {
      const itemId = masterBtn.getAttribute("data-toggle-master");
      if (!itemId) return;
      const c = getCardRecord(itemId, appState.activeSubject);
      if (c.status === "unlearned") {
        c.status = "learning";
        appState.mastery[itemId] = false;
        if (!c.nextReviewDate) c.nextReviewDate = getLocalDateString();
        showToast("「● 進行中」に設定しました（本日の分散復習に追加）");
      } else if (c.status === "learning") {
        c.status = "mastered";
        appState.mastery[itemId] = true;
        showToast("「✓ 習得済み」に設定しました");
      } else {
        c.status = "unlearned";
        appState.mastery[itemId] = false;
        showToast("「未習得」に戻しました");
      }
      saveStateToDB();
      renderApp();
      return;
    }

    // 9. ポイント開閉
    const pointBtn = e.target.closest("[data-toggle-point]");
    if (pointBtn) {
      const itemId = pointBtn.getAttribute("data-toggle-point");
      if (!itemId) return;
      const nextOpen = !Boolean(appState.openPoints[itemId]);
      appState.openPoints[itemId] = nextOpen;
      const wrap = pointBtn.closest(".point-wrap");
      if (wrap) {
        const noteEl = wrap.querySelector(".point-note");
        if (noteEl) noteEl.classList.toggle("is-open", nextOpen);
        pointBtn.setAttribute("aria-expanded", String(nextOpen));
        pointBtn.innerHTML = `<span>${nextOpen ? "▾ ポイント" : "▸ ポイント"}</span>`;
      }
      return;
    }

    // 10. ダッシュボードからジャンプ
    const jumpBtn = e.target.closest("[data-jump-subj]");
    if (jumpBtn) {
      appState.activeSubject = jumpBtn.getAttribute("data-jump-subj");
      appState.activeMode = jumpBtn.getAttribute("data-jump-mode") || "steps";
      appState.activeStepId = "all";
      saveStateToDB();
      renderApp();
      return;
    }

    // 11. 分散復習セッション開始・終了・フィルタ
    if (e.target.closest("#btnStartDueSession")) {
      appState.dueSessionActive = true;
      appState.dueIndex = 0;
      appState.testCardBlanks = {};
      renderApp();
      return;
    }
    if (e.target.closest("#btnExitDueSession")) {
      appState.dueSessionActive = false;
      appState.testCardBlanks = {};
      renderApp();
      return;
    }
    const dueSubjBtn = e.target.closest("[data-due-subj]");
    if (dueSubjBtn) {
      appState.dueSubjectFilter = dueSubjBtn.getAttribute("data-due-subj");
      appState.dueIndex = 0;
      renderApp();
      return;
    }

    // 12. 4択道場
    const quizOpt = e.target.closest("[data-quiz-opt]");
    if (quizOpt && !appState.quizAnswered) {
      const idx = parseInt(quizOpt.getAttribute("data-quiz-opt"), 10);
      const list = getFilteredQuizList();
      const q = list[appState.quizIndex];
      if (!q) return;
      appState.quizAnswered = true;
      appState.quizSelectedOpt = idx;
      const prev = appState.quizStats[q.id] || { correct: 0, wrong: 0, lastCorrect: false };
      if (idx === q.answer) {
        prev.correct++;
        prev.lastCorrect = true;
      } else {
        prev.wrong++;
        prev.lastCorrect = false;
      }
      appState.quizStats[q.id] = prev;
      saveStateToDB();
      renderApp();
      return;
    }

    const qFilter = e.target.closest("[data-quiz-filter]");
    if (qFilter) {
      appState.quizFilter = qFilter.getAttribute("data-quiz-filter");
      appState.quizIndex = 0;
      appState.quizAnswered = false;
      saveStateToDB();
      renderApp();
      return;
    }

    if (e.target.closest("#btnPrevQuiz")) {
      const list = getFilteredQuizList();
      if (list.length > 0) {
        appState.quizIndex = (appState.quizIndex - 1 + list.length) % list.length;
        appState.quizAnswered = false;
        renderApp();
      }
      return;
    }
    if (e.target.closest("#btnNextQuiz")) {
      const list = getFilteredQuizList();
      if (list.length > 0) {
        appState.quizIndex = (appState.quizIndex + 1) % list.length;
        appState.quizAnswered = false;
        renderApp();
      }
      return;
    }
  });

  // ★データ管理モーダル（元の正常なID・クラスで100%動作保証）★
  const modal = document.getElementById("dataModal");
  document.getElementById("openDataModalBtn").addEventListener("click", () => {
    document.getElementById("confirmResetBox").style.display = "none";
    modal.classList.add("open");
  });
  document.getElementById("closeDataModalBtn").addEventListener("click", () => {
    modal.classList.remove("open");
  });
  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.classList.remove("open");
  });

  document.getElementById("resetBlanksHiddenBtn").addEventListener("click", () => {
    appState.blanks = {};
    saveStateToDB();
    renderApp();
    modal.classList.remove("open");
    showToast("全教科の穴埋めをすべて隠しました");
  });

  document.getElementById("resetBlanksOpenBtn").addEventListener("click", () => {
    Object.keys(SUBJECT_DATA).forEach((sKey) => {
      getAllBlankIdsForSubject(sKey).forEach((id) => {
        appState.blanks[id] = true;
      });
    });
    saveStateToDB();
    renderApp();
    modal.classList.remove("open");
    showToast("全教科の穴埋めをすべて表示しました");
  });

  document.getElementById("reqResetAllBtn").addEventListener("click", () => {
    document.getElementById("confirmResetBox").style.display = "inline-flex";
  });
  document.getElementById("cancelResetAllBtn").addEventListener("click", () => {
    document.getElementById("confirmResetBox").style.display = "none";
  });
  document.getElementById("execResetAllBtn").addEventListener("click", () => {
    appState.blanks = {};
    appState.mastery = {};
    appState.spacedCards = {};
    appState.quizStats = {};
    appState.showOnlyUnmastered = false;
    saveStateToDB();
    loadStateFromDB();
    renderApp();
    document.getElementById("confirmResetBox").style.display = "none";
    modal.classList.remove("open");
    showToast("全データを初期化しました");
  });

  document.getElementById("exportJsonBtn").addEventListener("click", async () => {
    const payload = getPersistPayload();
    const jsonStr = JSON.stringify(payload, null, 2);
    const now = new Date();
    const ymd = now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, "0") +
      String(now.getDate()).padStart(2, "0");
    const fileName = `shidoyoryo_study_backup_${ymd}.json`;

    if (window.location.protocol === "file:" && navigator.canShare) {
      try {
        const file = new File([jsonStr], fileName, { type: "application/json" });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: fileName
          });
          showToast("バックアップを共有しました");
          return;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
    }

    const blob = new Blob([jsonStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(`${fileName} を書き出しました`);
  });

  document.getElementById("importJsonInput").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const parsed = JSON.parse(String(ev.target.result));
        if (parsed && typeof parsed === "object") {
          if (parsed.blanks && typeof parsed.blanks === "object") appState.blanks = parsed.blanks;
          if (parsed.mastery && typeof parsed.mastery === "object") appState.mastery = parsed.mastery;
          if (parsed.spacedCards && typeof parsed.spacedCards === "object") appState.spacedCards = parsed.spacedCards;
          if (parsed.quizStats && typeof parsed.quizStats === "object") appState.quizStats = parsed.quizStats;
          if (parsed.activeSubject) appState.activeSubject = parsed.activeSubject;
          if (parsed.activeMode) appState.activeMode = parsed.activeMode;
          await saveStateToDB();
          await loadStateFromDB();
          renderApp();
          modal.classList.remove("open");
          showToast("バックアップデータを復元しました");
        }
      } catch (err) {
        showToast("JSONファイルの読み込みに失敗しました");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });
}

window.addEventListener("DOMContentLoaded", async () => {
  await openStudyDB();
  await loadStateFromDB();
  setupEventListeners();
  renderApp();
});

</script>
</body>
</html>
